<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ComfyUI Mobile Panel</title>
<!-- 「高级」页的宿主页：参考项目（comfyui-mobile-frontend, MIT）的工作流面板
     在 iframe 里跑，这样它的整站样式既进不来也出不去，UI 与交互与参考项目完全一致。
     由 mobile/app.js 创建 iframe 打开，并通过 postMessage 切换工作流与语言。 -->
<link rel="stylesheet" href="/mobile/assets/panel.css?v=202610132">
<style>
  html, body { margin: 0; height: 100%; color: #e5e7eb; background: transparent; }
  #panel-root { display: flex; flex-direction: column; height: 100%; min-height: 0; background: transparent; }

  /* 面板外壳自带的深色底（参考项目里它是铺在自家整页上的 bg-slate-950/88），
     以及它给自己顶栏预留的 36px 空隙 —— 宿主页没有那层顶栏。
     这里只把"外壳"放透明并顶到最上面，让手机页自己的底色透过来；
     组卡与节点卡照旧，是面板本身的设计。 */
  #node-list-wrapper {
    background-color: transparent !important;
    top: 0 !important;
  }
</style>
</head>
<body>
<div id="panel-root"></div>
<script type="module">
  import "/mobile/assets/panel.js?v=202610132";
  const params = new URLSearchParams(location.search);
  const handle = globalThis.MobileRemotePanel.mount(document.getElementById("panel-root"), {locale: params.get("locale") || "zh"});
  addEventListener("message", event => {
    if (event.source !== parent || event.origin !== location.origin || event.data?.type !== "mtr-panel") return;
    handle.receive(event.data);
  });
  addEventListener("pagehide", () => handle.destroy(), {once:true});
  parent.postMessage({type:"mtr-panel",action:"ready"}, location.origin);
</script>
</body>
</html>
