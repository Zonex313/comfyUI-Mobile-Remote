<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ComfyUI Mobile Panel</title>
<!-- 「高级」页的宿主页：参考项目（comfyui-mobile-frontend, MIT）的工作流面板
     在 iframe 里跑，这样它的整站样式既进不来也出不去，UI 与交互与参考项目完全一致。
     由 mobile/app.js 创建 iframe 打开，并通过 postMessage 切换工作流与语言。

     面板脚本 1.4MB，手机网络下要下好几秒。这一页本身很小，所以由它自己去取 CSS 与 JS：
     流式读，边下边把字节数报给手机页画进度条，而不是让用户对着白屏等。取到的内容只消费
     一次 —— CSS 内联、JS 用 blob 导入 —— 所以不会下第二遍。 -->
<style>
  html, body { margin: 0; height: 100%; color: #e5e7eb; background: transparent; }
  #panel-root { display: flex; flex-direction: column; height: 100%; min-height: 0; background: transparent; }

  /* 面板外壳自带的深色底（参考项目里它是铺在自家整页上的 bg-slate-950/88），
     以及它给自己顶栏预留的 36px 空隙 —— 宿主页没有那层顶栏。
     这里只把"外壳"放透明并顶到最上面，让手机页自己的底色透过来；
     组卡与节点卡照旧，是面板本身的设计。 */
  #node-list-wrapper {
    background-color: transparent !important;
    top: 0 !important;
  }
</style>
</head>
<body>
<div id="panel-root"></div>
<script type="module">
  const params = new URLSearchParams(location.search);
  const locale = params.get("locale") || "zh";
  const suffix = params.get("v") ? "?v=" + encodeURIComponent(params.get("v")) : "";
  const asset = name => "/mobile/assets/" + name + suffix;

  const report = (phase, loaded, total) =>
    parent.postMessage({ type: "mtr-panel", action: "progress", progress: { phase, loaded, total } }, location.origin);

  async function fetchStreamed(url, onBytes) {
    const response = await fetch(url, { cache: "no-store" });
    if (!response.ok) throw new Error(url + " 返回 " + response.status);
    const total = Number(response.headers.get("Content-Length")) || 0;
    if (!response.body) return await response.text();
    const reader = response.body.getReader();
    const chunks = [];
    let loaded = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      loaded += value.length;
      onBytes(loaded, total);
    }
    const merged = new Uint8Array(loaded);
    let offset = 0;
    for (const chunk of chunks) { merged.set(chunk, offset); offset += chunk.length; }
    return new TextDecoder().decode(merged);
  }

  let mounted = false;
  let workflowSeen = false;
  let painted = false;

  /**
   * 挂载是异步的：React 先把外壳排上队列，工作流到了之后才排节点卡。
   * 「ready」只能说明组件挂上了，这时候 iframe 里还是白的 —— 手机页的加载条要等到
   * 真正画出内容才让位，否则下载完到首屏之间又是一段白屏，看着像进度条在骗人。
   */
  function reportPainted() {
    if (painted) return;
    painted = true;
    parent.postMessage({ type: "mtr-panel", action: "painted" }, location.origin);
  }

  function whenPainted(startedAt) {
    let frames = 0;
    const tick = () => {
      frames += 1;
      const root = document.getElementById("panel-root");
      // 面板在等节点类型定义（/api/object_info，装了自定义节点能到 5MB）时会把根节点设成
      // hidden：这时候 DOM 里已经有壳子了，但屏幕上是白的 —— 必须按「可见」判断。
      const visible = Boolean(root) && root.style.visibility !== "hidden";
      const settled =
        visible &&
        Boolean(
          root.querySelector("#node-list-shell") ||
            root.querySelector("#node-list-empty") ||
            // 占位卡只在确实没有工作流时才算数：工作流可能还在路上（大工作流比面板还慢）。
            (!workflowSeen &&
              root.querySelector("#node-list-no-workflow") &&
              Date.now() - startedAt > 1200),
        );
      // 留两帧：一帧给 React 提交，一帧给浏览器把首次绘制交出去。
      if ((settled && frames >= 2) || frames > 3600) return reportPainted();
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  function finish() {
    if (mounted) return;
    mounted = true;
    const startedAt = Date.now();
    const handle = globalThis.MobileRemotePanel.mount(document.getElementById("panel-root"), { locale });
    addEventListener("message", event => {
      if (event.source !== parent || event.origin !== location.origin || event.data?.type !== "mtr-panel") return;
      if (event.data.action === "workflow") workflowSeen = true;
      handle.receive(event.data);
    });
    addEventListener("pagehide", () => handle.destroy(), {once:true});
    parent.postMessage({type:"mtr-panel",action:"ready"}, location.origin);
    whenPainted(startedAt);
  }

  // 兜底：万一流式取或 blob 导入出问题，就退回原来的普通标签加载 —— 慢一点，但不白屏。
  function loadClassic() {
    if (globalThis.MobileRemotePanel) { finish(); return; }
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = asset("panel.css");
    document.head.prepend(link);
    const script = document.createElement("script");
    script.type = "module";
    script.src = asset("panel.js");
    script.onload = () => { try { finish(); } catch (error) { console.error(error); } };
    script.onerror = error => console.error(error);
    document.body.append(script);
  }

  (async () => {
    const bytes = { css: [0, 0], js: [0, 0] };
    const publish = phase => report(phase, bytes.css[0] + bytes.js[0], bytes.css[1] + bytes.js[1]);
    // 两条并行取：进度按两边的字节数合计，谁先到都不影响总数。
    const css = fetchStreamed(asset("panel.css"), (loaded, total) => { bytes.css = [loaded, total]; publish("styles"); });
    const js = fetchStreamed(asset("panel.js"), (loaded, total) => { bytes.js = [loaded, total]; publish("script"); });
    const [cssText, jsText] = await Promise.all([css, js]);
    const style = document.createElement("style");
    style.textContent = cssText;
    // 必须排在下面那段宿主页样式之前：面板自带的深色底要靠后写的规则盖掉。
    document.head.prepend(style);
    const blobUrl = URL.createObjectURL(new Blob([jsText], { type: "text/javascript" }));
    await import(blobUrl);
    URL.revokeObjectURL(blobUrl);
    finish();
  })().catch(error => { console.error(error); loadClassic(); });
</script>
</body>
</html>
