<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ComfyUI Mobile Panel</title>
<!-- 「高级」页的宿主页：参考项目（comfyui-mobile-frontend, MIT）的工作流面板
     在 iframe 里跑，这样它的整站样式既进不来也出不去，UI 与交互与参考项目完全一致。
     由 mobile/app.js 创建 iframe 打开，并通过 postMessage 切换工作流与语言。 -->
<link rel="stylesheet" href="/mobile/assets/panel.css?v=202610126">
<style>
  html, body { margin: 0; height: 100%; background: #05070d; color: #e5e7eb; }
  #panel-root { display: flex; flex-direction: column; height: 100%; min-height: 0; }
</style>
</head>
<body>
<div id="panel-root"></div>
<script type="module">
  import "/mobile/assets/panel.js?v=202610126";
  const params = new URLSearchParams(location.search);
  const handle = globalThis.MobileRemotePanel.mount(document.getElementById("panel-root"), {
    workflowId: params.get("workflow") || "",
    locale: params.get("locale") || "",
  });
  addEventListener("message", (event) => {
    const data = event.data;
    if (!data || data.type !== "mtr-panel" || !handle) return;
    if (data.action === "workflow") Promise.resolve(handle.setWorkflow(String(data.value || ""))).catch(() => {});
    else if (data.action === "locale") handle.setLocale(String(data.value || ""));
  });
  // 宿主能据此知道面板起来了（测试与故障排查都用得上）。
  try { parent.postMessage({ type: "mtr-panel", action: "ready" }, "*"); } catch (error) { /* 跨源时忽略 */ }
</script>
</body>
</html>
